<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | New Vision Academy</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body { background: linear-gradient(135deg, #1a365d, #2c5282); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
.login-card { background: #fff; border-radius: 16px; padding: 40px; width: 100%; max-width: 420px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
.login-card h3 { color: #1a365d; margin-bottom: 8px; }
</style>
</head>
<body>
<div class="login-card">
<div class="text-center mb-4">
<i class="fas fa-graduation-cap fa-3x text-primary mb-2" style="color:#1a365d"></i>
<h3>New Vision Academy</h3>
<p class="text-muted">Admin Panel Login</p>
</div>
{% with messages = get_flashed_messages(with_categories=true) %}
{% if messages %}{% for cat, msg in messages %}
<div class="alert alert-{{ cat }}">{{ msg }}</div>
{% endfor %}{% endif %}{% endwith %}
<form method="POST">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="mb-3"><label class="form-label">Username or Email</label>
<input type="text" name="username" class="form-control form-control-lg" required autofocus></div>
<div class="mb-3"><label class="form-label">Password</label>
<input type="password" name="password" class="form-control form-control-lg" required></div>
<div class="mb-3 form-check"><input type="checkbox" name="remember" class="form-check-input" id="rem">
<label class="form-check-label" for="rem">Remember me</label></div>
<button type="submit" class="btn btn-primary btn-lg w-100" style="background:#1a365d;border:none">Login</button>
</form>
<p class="text-center text-muted mt-3 small">Default: admin / admin123</p>
</div>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
</body>
</html>
