{% extends "public/base.html" %}
{% block title %}Gallery | {{ school_name }}{% endblock %}
{% block content %}
<div class="page-header"><div class="container"><h1>Gallery</h1></div></div>
<section class="section"><div class="container"><div class="row g-4">
{% for a in albums %}
<div class="col-md-4"><div class="content-card"><div class="body">
<h5><a href="{{ url_for("public.gallery_album", slug=a.slug) }}">{{ a.title }}</a></h5>
<p class="small text-muted">{{ a.description or "" }}</p>
</div></div></div>
{% else %}<p>No albums yet.</p>{% endfor %}
</div></div></section>
{% endblock %}
