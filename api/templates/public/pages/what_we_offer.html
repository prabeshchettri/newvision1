{% extends "public/base.html" %}
{% block title %}What We Offer | {{ school_name }}{% endblock %}
{% block content %}
<div class="page-header"><div class="container"><h1>What We Offer</h1></div></div>
<section class="section"><div class="container"><div class="row g-4">
{% for o in offers %}
<div class="col-md-6"><div class="feature-card"><div class="icon"><i class="{{ o.icon or "fas fa-star" }}"></i></div><h5>{{ o.title }}</h5><p>{{ o.description }}</p></div></div>
{% endfor %}
</div></div></section>
{% endblock %}
