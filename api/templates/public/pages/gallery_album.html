{% extends "public/base.html" %}
{% block title %}{{ album.title }} | Gallery{% endblock %}
{% block content %}
<div class="page-header"><div class="container"><h1>{{ album.title }}</h1></div></div>
<section class="section"><div class="container">
<div class="gallery-grid">
{% for m in media %}
<div class="gallery-item">
<img src="{{ m.file_path|media }}" alt="{{ m.title or "" }}" loading="lazy">
</div>
{% else %}<p>No media in this album.</p>{% endfor %}
</div></div></section>
{% endblock %}
