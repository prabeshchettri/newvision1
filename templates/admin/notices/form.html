{% extends "admin/base.html" %}
{% block title %}{% if notice %}Edit{% else %}Add{% endif %} Notice{% endblock %}
{% block page_title %}{% if notice %}Edit{% else %}Add{% endif %} Notice{% endblock %}
{% block content %}
<form method="POST" enctype="multipart/form-data">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="card"><div class="card-body">
<div class="mb-3"><label>Title *</label><input type="text" name="title" class="form-control" value="{{ notice.title if notice else "" }}" required></div>
<div class="mb-3"><label>Content</label><textarea name="content" class="form-control" rows="8">{{ notice.content if notice else "" }}</textarea></div>
<div class="row g-3 mb-3">
<div class="col-md-3"><div class="form-check"><input type="checkbox" name="is_featured" class="form-check-input" {% if notice and notice.is_featured %}checked{% endif %}><label class="form-check-label">Featured</label></div></div>
<div class="col-md-3"><div class="form-check"><input type="checkbox" name="is_important" class="form-check-input" {% if notice and notice.is_important %}checked{% endif %}><label class="form-check-label">Important</label></div></div>
<div class="col-md-3"><div class="form-check"><input type="checkbox" name="is_pinned" class="form-check-input" {% if notice and notice.is_pinned %}checked{% endif %}><label class="form-check-label">Pinned</label></div></div>
<div class="col-md-3"><div class="form-check"><input type="checkbox" name="is_active" class="form-check-input" {% if not notice or notice.is_active %}checked{% endif %}><label class="form-check-label">Active</label></div></div>
</div>
<div class="mb-3"><label>Attachment (PDF)</label><input type="file" name="attachment" class="form-control" accept=".pdf"></div>
<button type="submit" class="btn btn-primary">Save</button>
<a href="{{ url_for("admin.notices_list") }}" class="btn btn-secondary">Cancel</a>
</div></div></form>
{% endblock %}
