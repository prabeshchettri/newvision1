{% extends "admin/base.html" %}
{% block title %}Backup{% endblock %}{% block page_title %}Database Backup{% endblock %}
{% block content %}
<div class="card"><div class="card-body">
<p>Create a backup of the SQLite database or download the current database file.</p>
<form method="POST" action="{{ url_for("admin.backup_create") }}" class="d-inline">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<button type="submit" class="btn btn-primary"><i class="fas fa-database"></i> Create Backup</button>
</form>
<a href="{{ url_for("admin.backup_download") }}" class="btn btn-success"><i class="fas fa-download"></i> Download Database</a>
</div></div>
{% endblock %}
