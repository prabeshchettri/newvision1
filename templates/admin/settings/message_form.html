{% extends "admin/base.html" %}
{% block title %}{{ title }}{% endblock %}{% block page_title %}{{ title }}{% endblock %}
{% block content %}
<form method="POST" enctype="multipart/form-data">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="card"><div class="card-body">
<div class="row g-3 mb-3">
<div class="col-md-6"><label>Name</label><input type="text" name="name" class="form-control" value="{{ item.name or "" }}"></div>
<div class="col-md-6"><label>Designation</label><input type="text" name="designation" class="form-control" value="{{ item.designation or "" }}"></div>
</div>
<div class="mb-3"><label>Message</label><textarea name="message" class="form-control" rows="8">{{ item.message or "" }}</textarea></div>
<div class="mb-3"><label>Photo</label><input type="file" name="photo" class="form-control" accept="image/*"></div>
<div class="form-check mb-3"><input type="checkbox" name="is_active" class="form-check-input" {% if item.is_active %}checked{% endif %}><label class="form-check-label">Active</label></div>
<button type="submit" class="btn btn-primary">Save</button>
</div></div></form>
{% endblock %}
